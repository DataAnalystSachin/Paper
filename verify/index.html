<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Marksheet Verification</title>
<style>
:root{--navy:#1f3864;--gold:#b8913a;--ok:#1b7f3b;--bad:#c0392b;--bg:#eef1f7;--card:#fff;--tx:#1a1f2b;--mu:#667085;--ln:#e3e7ef}
@media (prefers-color-scheme:dark){:root{--bg:#10141c;--card:#1a2030;--tx:#e8ecf4;--mu:#9aa4b8;--ln:#2a3248}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);color:var(--tx);font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif}
.card{width:100%;max-width:460px;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 6px 28px rgba(20,30,60,.14)}
.head{background:var(--navy);color:#fff;text-align:center;padding:18px 16px;border-bottom:3px solid var(--gold)}
.org{font-size:19px;font-weight:700}
.sub{font-size:12px;opacity:.8;margin-top:3px;letter-spacing:.06em;text-transform:uppercase}
.state{text-align:center;padding:26px 20px 8px}
.icon{width:62px;height:62px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff;font-weight:700}
.ok .icon{background:var(--ok)}.bad .icon{background:var(--bad)}
.title{font-size:20px;font-weight:700}
.ok .title{color:var(--ok)}.bad .title{color:var(--bad)}
.msg{font-size:13.5px;color:var(--mu);margin:6px 0 0;line-height:1.5}
table{width:100%;border-collapse:collapse;margin:14px 0 4px}
td{padding:9px 20px;font-size:14px;border-top:1px solid var(--ln);vertical-align:top}
td:first-child{color:var(--mu);width:42%}
td:last-child{font-weight:600;text-align:right;word-break:break-word}
.pass{color:var(--ok)}.fail{color:var(--bad)}
.foot{padding:12px 20px 16px;text-align:center;font-size:11.5px;color:var(--mu);border-top:1px solid var(--ln)}
.spin{width:34px;height:34px;border:4px solid var(--ln);border-top-color:var(--navy);border-radius:50%;margin:6px auto 12px;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main class="card">
<div class="head"><div class="org" id="org">Marksheet Verification</div><div class="sub">Official online verification</div></div>
<div id="out"><div class="state"><div class="spin"></div><p class="msg">Verifying marksheet...</p></div></div>
<div class="foot">Compare these details with the printed marksheet.<br>Any difference means the document is not genuine.</div>
</main>
<script>
(function(){
var q=new URLSearchParams(location.search);
var e=q.get('e')||'',c=q.get('c')||'',d=q.get('d')||'';
var out=document.getElementById('out');
function el(t,cls,txt){var n=document.createElement(t);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function state(kind,icon,title,msg){
 out.innerHTML='';
 var s=el('div','state '+kind);
 s.appendChild(el('div','icon',icon));
 s.appendChild(el('div','title',title));
 s.appendChild(el('p','msg',msg));
 out.appendChild(s);
 return s;
}
function bad(title,msg){state('bad','\u2715',title,msg)}
function hex(b){return Array.from(new Uint8Array(b)).map(function(x){return('0'+x.toString(16)).slice(-2)}).join('')}
function sha(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(hex)}
function good(p,id){
 state('ok','\u2713','Verified - Genuine','This marksheet was issued by the institute and matches our records.');
 var f=p.slice();
 var rows=[['Student Name',f[0]],['Student ID',f[1]],['Examination',f[2]],
  ['Marks Obtained',f[3]+' / '+f[4]],['Percentage',f[5]+'%'],['Grade',f[6]],['Result',f[7]],['Issue Date',f[8]],['Verification ID',id]];
 var t=el('table');
 rows.forEach(function(r){
  var tr=el('tr');tr.appendChild(el('td','',r[0]));
  var td=el('td','',r[1]||'-');
  if(r[0]==='Result'){td.className=(String(r[1]).toUpperCase()==='PASS')?'pass':'fail'}
  tr.appendChild(td);t.appendChild(tr);
 });
 out.appendChild(t);
}
if(!e||!c||!d){bad('Invalid link','This verification link is incomplete. Please scan the QR code on the marksheet again.');return}
if(!window.crypto||!crypto.subtle){bad('Browser not supported','Please open this page in an up-to-date browser (secure https connection).');return}
var p=d.split('|');
Promise.all([
 sha(e+'|'+c+'|'+d),
 fetch('data/'+encodeURIComponent(e)+'.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('nf');return r.json()})
]).then(function(a){
 var j=a[1];
 if(j.org)document.getElementById('org').textContent=j.org;
 if(p.length>=9&&j.hashes&&j.hashes.indexOf(a[0])>=0){good(p,c.slice(0,5)+'-'+c.slice(5))}
 else{bad('Not verified','The details in this link do not match our records. This marksheet may have been altered or is not genuine.')}
}).catch(function(){
 bad('Record not found','We could not load the records for this examination. If this marksheet was issued just now, please wait a few minutes and scan again.');
});
})();
</script>
</body>
</html>
