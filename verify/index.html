<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14274e">
<title>Marksheet Verification</title>
<style>
:root{--navy:#14274e;--navy2:#1f3c75;--gold:#c9a24b;--ok:#13a452;--ok2:#0e8a44;--bad:#d64545;--bg1:#e9eef8;--bg2:#f7f9fd;--card:#ffffff;--tx:#18202f;--mu:#6b7690;--ln:#e6eaf3;--sh:0 18px 50px rgba(20,39,78,.18)}
@media (prefers-color-scheme:dark){:root{--bg1:#0b1226;--bg2:#101a33;--card:#16203a;--tx:#eaf0ff;--mu:#9aa8c7;--ln:#26324f;--sh:0 18px 50px rgba(0,0,0,.45)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px 14px;color:var(--tx);font-family:"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(1200px 600px at 50% -10%,var(--bg1),var(--bg2))}
.card{width:100%;max-width:440px;background:var(--card);border-radius:20px;overflow:hidden;box-shadow:var(--sh);animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.head{position:relative;text-align:center;padding:26px 20px 66px;color:#fff;background:linear-gradient(135deg,var(--navy),var(--navy2))}
.head:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.org{font-size:20px;font-weight:700;letter-spacing:.2px}
.sub{margin-top:6px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.78}
.seal{position:relative;width:96px;height:96px;margin:-52px auto 0}
.seal .ring{position:absolute;inset:0;border-radius:50%;background:var(--ok);opacity:.0;animation:ripple 2.4s ease-out infinite}
.seal .ring.r2{animation-delay:1.2s}
@keyframes ripple{0%{transform:scale(.8);opacity:.45}100%{transform:scale(1.5);opacity:0}}
.seal .disc{position:absolute;inset:8px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 25%,#35d17a,var(--ok) 55%,var(--ok2));box-shadow:0 0 0 6px var(--card),0 10px 26px rgba(19,164,82,.5);animation:glow 1.8s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 6px var(--card),0 10px 26px rgba(19,164,82,.45)}50%{box-shadow:0 0 0 6px var(--card),0 10px 40px rgba(19,164,82,.95)}}
.seal svg{width:46px;height:46px;fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.seal .tick{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .7s .35s ease forwards,blink 1.8s 1.2s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.bad .seal .ring{background:var(--bad)}
.bad .seal .disc{background:radial-gradient(circle at 30% 25%,#ff7b7b,var(--bad) 60%,#b53030);animation:shake .6s both;box-shadow:0 0 0 6px var(--card),0 10px 26px rgba(214,69,69,.5)}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.bad .seal .tick{stroke-dashoffset:0;animation:none}
.wait .seal .disc{background:var(--navy2);animation:none}
.wait .seal .ring{display:none}
.spin{width:42px;height:42px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.status{text-align:center;padding:16px 22px 6px}
.badge{display:inline-block;padding:5px 14px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ok2);background:rgba(19,164,82,.12);border:1px solid rgba(19,164,82,.35)}
.bad .badge{color:var(--bad);background:rgba(214,69,69,.1);border-color:rgba(214,69,69,.35)}
.title{margin:12px 0 0;font-size:22px;font-weight:800}
.msg{margin:8px 0 0;font-size:13.5px;line-height:1.55;color:var(--mu)}
.list{margin:18px 18px 6px;border:1px solid var(--ln);border-radius:14px;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 16px;border-top:1px solid var(--ln);opacity:0;animation:fade .5s ease forwards}
.row:first-child{border-top:0}
.row .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);white-space:nowrap}
.row .v{font-size:15px;font-weight:700;text-align:right;word-break:break-word}
.row.hero .v{font-size:17px}
@keyframes fade{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
.chip{display:inline-block;padding:3px 14px;border-radius:999px;font-size:13px;font-weight:800;letter-spacing:.08em}
.chip.pass{color:#fff;background:var(--ok)}
.chip.fail{color:#fff;background:var(--bad)}
.stamp{margin:12px 18px 0;text-align:center;font-size:12px;color:var(--mu)}
.foot{margin-top:16px;padding:14px 22px 18px;text-align:center;font-size:11.5px;line-height:1.55;color:var(--mu);border-top:1px solid var(--ln);background:linear-gradient(0deg,rgba(120,140,190,.07),transparent)}
.foot b{color:var(--tx)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<main class="card wait" id="card">
<div class="head"><div class="org" id="org">Marksheet Verification</div><div class="sub">Official online verification</div></div>
<div class="seal"><span class="ring"></span><span class="ring r2"></span><div class="disc" id="disc"><div class="spin"></div></div></div>
<div class="status" id="status"><p class="msg">Checking records...</p></div>
<div id="list"></div>
<div class="foot"><b>Privacy protected.</b> Only the details needed to verify are shown.<br>Compare them with the printed marksheet - any difference means it is not genuine.</div>
</main>
<script>
(function(){
var q=new URLSearchParams(location.search);
var e=q.get('e')||'',c=q.get('c')||'',d=q.get('d')||'';
var card=document.getElementById('card'),disc=document.getElementById('disc');
var status=document.getElementById('status'),list=document.getElementById('list');
function el(t,cls,txt){var n=document.createElement(t);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
var TICK='<svg viewBox="0 0 52 52"><path class="tick" d="M14 27 l8 8 l16 -18"/></svg>';
var CROSS='<svg viewBox="0 0 52 52"><path class="tick" d="M16 16 l20 20 M36 16 l-20 20"/></svg>';
function head(kind,badge,title,msg){
 card.className='card '+kind;
 disc.innerHTML=kind==='bad'?CROSS:TICK;
 status.innerHTML='';
 status.appendChild(el('span','badge',badge));
 status.appendChild(el('h1','title',title));
 status.appendChild(el('p','msg',msg));
}
function bad(title,msg){head('bad','Not verified',title,msg)}
function hex(b){return Array.from(new Uint8Array(b)).map(function(x){return('0'+x.toString(16)).slice(-2)}).join('')}
function sha(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(hex)}
function good(p,id){
 head('ok','Authentic','Verified - Genuine','This marksheet was issued by the institute and matches its official record.');
 var rows=[['Student Name',p[0],1],['Student ID',p[1],1],['Examination',p[2]],['Subject / Course',p[3]],['Result',p[4]],['Issue Date',p[5]],['Verification ID',id]];
 var box=el('div','list');
 rows.forEach(function(r,i){
  var row=el('div','row'+(r[2]?' hero':''));
  row.style.animationDelay=(0.25+i*0.08)+'s';
  row.appendChild(el('span','k',r[0]));
  var v=el('span','v');
  if(r[0]==='Result'){var up=String(r[1]).toUpperCase();v.appendChild(el('span','chip '+(up==='PASS'?'pass':'fail'),up))}
  else{v.textContent=r[1]||'-'}
  row.appendChild(v);box.appendChild(row);
 });
 list.innerHTML='';list.appendChild(box);
 var now=new Date();
 list.appendChild(el('div','stamp','Checked on '+now.toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'})+', '+now.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})));
}
if(!e||!c||!d){bad('Invalid link','This verification link is incomplete. Please scan the QR code on the marksheet again.');return}
if(!window.crypto||!crypto.subtle){bad('Browser not supported','Please open this page in an up-to-date browser over a secure (https) connection.');return}
var p=d.split('|');
Promise.all([
 sha(e+'|'+c+'|'+d),
 fetch('data/'+encodeURIComponent(e)+'.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('nf');return r.json()})
]).then(function(a){
 var j=a[1];
 if(j.org)document.getElementById('org').textContent=j.org;
 if(p.length>=6&&j.hashes&&j.hashes.indexOf(a[0])>=0){good(p,c.slice(0,5)+'-'+c.slice(5))}
 else{bad('Could not verify','The details in this link do not match our records. This marksheet may have been altered or is not genuine.')}
}).catch(function(){
 bad('Record not found','We could not load the records for this examination. If this marksheet was issued just now, please wait a few minutes and scan again.');
});
})();
</script>
</body>
</html>
